# Gaming/desktop latency policy.
#
# Deliberately small: cachyos-settings already supplies zram, I/O schedulers,
# dirty-page policy, fq_codel and sane cache pressure. Repeating those under
# /etc would freeze upstream tuning and make upgrades harder.

# Modern games and Wine/Proton reserve large VM areas. Fedora 43/systemd may
# already set 1048576; this makes the requirement explicit across rebases.
vm.max_map_count = 1048576

# Keep inotify-heavy launchers, IDEs, Proton prefixes and sync clients from
# exhausting the default watcher pool.
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 8192

# Old Windows games using split locks can otherwise be throttled severely.
# Desktop image trade-off: malicious local code can impose a system-wide CPU
# penalty. Re-enable (=1) on multi-user/untrusted hosts.
kernel.split_lock_mitigate = 0
