# TLP defaults prioritize battery life. On AC, disable the two settings most
# likely to cause desktop/gaming glitches. Battery behaviour remains unchanged.
SOUND_POWER_SAVE_ON_AC=0
RUNTIME_PM_ON_AC=on
WIFI_PWR_ON_AC=off

# TLP already excludes USB input devices from autosuspend. Keep it enabled for
# non-input devices rather than globally trading battery life for no benefit.
USB_AUTOSUSPEND=1
