# Forward everything to dnscrypt-proxy, which re-sends it over DoH.
[Resolve]
DNS=[IP_9c6e8e4a2b5f]
Domains=~.

# Never reachable while DNS= is set, but stated so a future edit that empties
# DNS= fails loudly instead of silently falling back to Google/Cloudflare plain.
FallbackDNS=

# dnscrypt-proxy already validates the DoH channel; resolved re-encrypting to a
# localhost forwarder would just cost handshakes.
DNSOverTLS=no
DNSSEC=no

# avahi owns .local. Two mDNS responders on one host fight over port 5353.
MulticastDNS=no
LLMNR=no

DNSStubListener=yes
Cache=yes
