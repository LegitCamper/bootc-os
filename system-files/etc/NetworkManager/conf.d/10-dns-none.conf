# Stop NetworkManager pushing DHCP-supplied nameservers into systemd-resolved.
#
# Without this the DoH forwarder leaks: NM tags the default-route connection
# with the `~.` routing domain, so resolved queries the ISP/router resolver in
# parallel with [IP_9c6e8e4a2b5f]. `dns=none` leaves resolved with only the servers from
# resolved.conf.d/10-dnscrypt.conf.
#
# Trade-off: DNS pushed by NM-managed VPNs (openvpn, NM wireguard) is ignored.
# Tailscale is unaffected — tailscaled configures resolved over D-Bus directly,
# not through NM, so MagicDNS still works.
[main]
dns=none
systemd-resolved=false
